services:
  nginx:
    image: "nginx:stable-alpine"
    ports:
      - "8000:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./src:/var/www/laravel
    depends_on:
      - mysql
      - php
      - node
  php:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
    volumes:
      - ./src:/var/www/laravel
  mysql:
    image: mysql:8.0
    ports:
      - "3316:3306"
    env_file:
      - env/mysql.env
    volumes:
      - db_data:/var/lib/mysql
  composer:
    build:
      context: dockerfiles
      dockerfile: composer.Dockerfile
    volumes:
      - ./src:/var/www/laravel
  artisan:
    build:
      context: dockerfiles
      dockerfile: php.Dockerfile
    volumes:
      - ./src:/var/www/laravel
    entrypoint: ["php", "/var/www/laravel/artisan"]
  node:
    image: node:lts-alpine
    working_dir: /var/www/laravel
    volumes:
      - ./src:/var/www/laravel
      # Важно: используем именованный том для node_modules,
      # чтобы он не перезаписывался папкой с хоста (где его может не быть)
      - node_modules:/var/www/laravel/node_modules
    ports:
      - "5173:5173" # Пробрасываем порт Vite на хост
    environment:
      # На macOS файловые события не пробрасываются в контейнер,
      # поэтому включаем polling для работы HMR
      - CHOKIDAR_USEPOLLING=true
    # Запускаем dev-сервер сразу при старте контейнера
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
volumes:
  db_data:
  node_modules: